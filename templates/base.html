<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة شركة الشحن</title>
    <!-- Google Fonts: Cairo for Arabic -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Hotwire Turbo for instantaneous SPA page transitions -->
    <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@7.3.0/dist/turbo.es2017-umd.js"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f6f9;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .table-responsive {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .btn {
            border-radius: 8px;
            font-weight: 600;
        }
        .badge {
            font-size: 0.9em;
            padding: 0.5em 0.8em;
            border-radius: 6px;
        }
        .orders-summary-blur-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .orders-summary-blur-card .card-sensitive-val {
            filter: blur(6px);
            transition: filter 0.2s ease, opacity 0.2s ease;
            user-select: none;
            -webkit-user-select: none;
            display: inline-block;
        }
        /* 1. Hover on card reveals numbers temporarily */
        .orders-summary-blur-card:hover .card-sensitive-val {
            filter: none;
            user-select: text;
            -webkit-user-select: text;
        }
        .orders-summary-blur-card:not(.is-pinned):hover #summaryCardEyeIcon::before {
            content: "\f06e"; /* fa-eye */
        }
        /* 2. Pinned state keeps numbers revealed fixed */
        .orders-summary-blur-card.is-pinned .card-sensitive-val {
            filter: none !important;
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        .summary-eye-btn {
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.15s;
            cursor: pointer;
            line-height: 1;
        }
        .summary-eye-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

    <div class="container-fluid px-3 px-xl-4 mt-3 mb-5" style="max-width: 1650px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                        <i class="fa-solid fa-circle-info me-2"></i> {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
