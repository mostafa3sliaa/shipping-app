{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="fa-solid fa-pen-to-square me-2"></i> تعديل بيانات الأوردر ({{ order.tracking_number }})</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">اسم العميل</label>
                        <input type="text" name="client_name" class="form-control" value="{{ order.client_name }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">رقم التليفون</label>
                        <input type="text" name="phone" class="form-control" value="{{ order.phone }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">المنطقة</label>
                        <input type="text" name="region" class="form-control" value="{{ order.region }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">العنوان بالكامل</label>
                        <textarea name="address" class="form-control" rows="2">{{ order.address }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-success">مبلغ التحصيل (COD)</label>
                            <input type="number" step="0.01" name="cod" class="form-control" value="{{ order.cod }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-danger">رسوم الشحن</label>
                            <input type="number" step="0.01" name="shipping_fee" class="form-control" value="{{ order.shipping_fee }}">
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">الحالة</label>
                            <select name="status" class="form-select">
                                <option value="جديد بالمخزن" {% if order.status == 'جديد بالمخزن' %}selected{% endif %}>جديد بالمخزن</option>
                                <option value="قيد التوصيل" {% if order.status == 'قيد التوصيل' %}selected{% endif %}>قيد التوصيل</option>
                                <option value="مؤجل" {% if order.status == 'مؤجل' %}selected{% endif %}>مؤجل</option>
                                <option value="مرتجع" {% if order.status == 'مرتجع' %}selected{% endif %}>مرتجع</option>
                                <option value="تم التوصيل" {% if order.status == 'تم التوصيل' %}selected{% endif %}>تم التوصيل</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">المندوب (إن وجد)</label>
                            <select name="courier_id" class="form-select">
                                <option value="">-- بدون مندوب --</option>
                                {% for courier in couriers %}
                                <option value="{{ courier.id }}" {% if order.courier_id == courier.id %}selected{% endif %}>{{ courier.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('orders') }}" class="btn btn-secondary"><i class="fa-solid fa-arrow-right me-2"></i> إلغاء ورجوع</a>
                        <button type="submit" class="btn btn-success"><i class="fa-solid fa-save me-2"></i> حفظ التعديلات</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
